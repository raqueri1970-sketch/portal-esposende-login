<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Portal Esposende — Entrar</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#02060d;color:#fff;font-family:Inter,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:340px;background:#080f1c;border:1px solid rgba(148,163,184,.12);border-radius:14px;padding:28px 24px}
.ttl{font-size:18px;font-weight:800;margin-bottom:4px}
.sub{font-size:12.5px;color:#6b88a8;margin-bottom:22px}
label{display:block;font-size:11.5px;color:#a8bdd8;margin-bottom:6px;font-weight:600}
input{width:100%;background:#0b1423;border:1px solid rgba(148,163,184,.24);color:#fff;border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:16px}
input:focus{outline:none;border-color:#3b82f6}
button{width:100%;background:#3b82f6;color:#fff;border:none;border-radius:8px;padding:11px;font-size:14px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
#status{margin-top:14px;font-size:12.5px;color:#f59e0b;min-height:16px}
#status.err{color:#ff3355}
#status.ok{color:#10b981}
#portalFrame{display:none;position:fixed;inset:0;width:100vw;height:100vh;border:none;z-index:9999;background:#02060d}
body.portal-on{display:block;padding:0}
body.portal-on .card{display:none}
#btnSair{position:fixed;top:10px;right:10px;z-index:10000;display:none;background:rgba(15,23,42,.88);color:#94a3b8;border:1px solid rgba(148,163,184,.24);border-radius:8px;padding:6px 12px;font-size:11.5px;cursor:pointer}
body.portal-on #btnSair{display:block}
.link-esqueci{display:block;text-align:center;margin-top:14px;font-size:12px;color:#6b88a8;background:none;border:none;cursor:pointer;text-decoration:underline;padding:0}
.link-esqueci:hover{color:#93b3d9}
.hidden{display:none !important}
.voltar{background:none;border:none;color:#6b88a8;font-size:12px;text-decoration:underline;cursor:pointer;margin-top:14px;padding:0;width:auto;display:block;margin-left:auto;margin-right:auto}
</style>
</head>
<body>
<div class="card">
  <div class="ttl">🏢 Portal Esposende</div>
  <div class="sub">Central de Auditoria &amp; Controle</div>
  <form id="loginForm">
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Senha</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button id="btn" type="submit">Entrar</button>
  </form>
  <button id="linkEsqueci" class="link-esqueci" type="button">Esqueci minha senha</button>

  <form id="formEsqueci" class="hidden">
    <label for="emailRecup">E-mail cadastrado</label>
    <input id="emailRecup" type="email" autocomplete="username" required>
    <button id="btnEsqueci" type="submit">Enviar link de recuperação</button>
    <button id="btnVoltarLogin" class="voltar" type="button">Voltar para o login</button>
  </form>

  <form id="formNovaSenha" class="hidden">
    <label for="novaSenha">Nova senha</label>
    <input id="novaSenha" type="password" autocomplete="new-password" minlength="6" required>
    <button id="btnNovaSenha" type="submit">Salvar nova senha</button>
  </form>

  <div id="status"></div>
</div>
<button id="btnSair" type="button">Sair</button>
<iframe id="portalFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-downloads allow-modals allow-popups allow-top-navigation-by-user-activation allow-popups-to-escape-sandbox"></iframe>
<script>
var SB_URL='https://rdztzurfesnobfkazgpm.supabase.co';
var SB_KEY='sb_publishable_4LHSO4TrP7F4m4tpJyH44g_BGmfC92h';
var sb=supabase.createClient(SB_URL,SB_KEY);
var BUCKET='portal-file';
// Caminho novo (2026-08-19): o antigo 'PORTAL_ESPOSENDE_V4.html' tinha uma URL assinada de
// 10 anos publica no historico do repo GitHub Pages, que continuaria funcionando pra sempre
// mesmo com o login de volta. Trocado de caminho (e o objeto antigo removido do Storage) pra
// invalidar aquele acesso — URLs assinadas antigas ficam presas ao caminho, nao ao conteudo.
var FILE_PATH='PORTAL_ESPOSENDE_V4_AUTH.html';

function setStatus(msg,cls){
  var el=document.getElementById('status');
  el.textContent=msg;el.className=cls||'';
}

// O Supabase Storage força Content-Type text/plain + CSP sandbox em qualquer
// arquivo (proteção deles contra hospedar HTML executável direto). Por isso
// buscamos o conteúdo via fetch() autenticado e montamos um Blob local — o
// mesmo truque que o próprio portal já usa pros módulos (getBlobUrl/execMod).
async function openPortal(){
  setStatus('Abrindo o portal...','ok');
  var res=await sb.storage.from(BUCKET).createSignedUrl(FILE_PATH,3600);
  if(res.error){ setStatus('Erro ao abrir o portal: '+res.error.message,'err'); return; }
  var fileRes=await fetch(res.data.signedUrl);
  if(!fileRes.ok){ setStatus('Erro ao baixar o portal (status '+fileRes.status+')','err'); return; }
  var html=await fileRes.text();
  var blob=new Blob([html],{type:'text/html;charset=utf-8'});
  var blobUrl=URL.createObjectURL(blob);
  var ifr=document.getElementById('portalFrame');
  ifr.src=blobUrl;
  ifr.style.display='block';
  document.body.classList.add('portal-on');
}

async function tryAutoLogin(){
  var res=await sb.auth.getSession();
  if(res.data&&res.data.session){ openPortal(); return true; }
  return false;
}

document.getElementById('loginForm').addEventListener('submit',async function(e){
  e.preventDefault();
  var email=document.getElementById('email').value;
  var password=document.getElementById('password').value;
  var btn=document.getElementById('btn');
  btn.disabled=true;
  setStatus('Entrando...','');
  var res=await sb.auth.signInWithPassword({email:email,password:password});
  if(res.error){ setStatus('Login inválido: '+res.error.message,'err'); btn.disabled=false; return; }
  await openPortal();
});

document.getElementById('btnSair').addEventListener('click',async function(){
  await sb.auth.signOut();
  document.body.classList.remove('portal-on');
  var ifr=document.getElementById('portalFrame');
  ifr.style.display='none';
  ifr.src='';
  document.getElementById('email').value='';
  document.getElementById('password').value='';
  setStatus('');
  document.getElementById('btn').disabled=false;
});

/* ---------- Esqueci minha senha ---------- */
// Fluxo padrao do Supabase Auth: o usuario pede o link, recebe um e-mail no endereco
// JA CADASTRADO (nunca cria conta nova nem aceita e-mail arbitrario), clica no link e volta
// pra esta mesma pagina com um token de recuperacao na URL - o evento PASSWORD_RECOVERY abaixo
// detecta isso e mostra o formulario de nova senha. Nao existe senha padrao/fixa nesse fluxo:
// quem define a senha nova e sempre o usuario, no formulario, depois de provar que tem acesso
// aquele e-mail.
var formLogin=document.getElementById('loginForm');
var linkEsqueci=document.getElementById('linkEsqueci');
var formEsqueci=document.getElementById('formEsqueci');
var formNovaSenha=document.getElementById('formNovaSenha');

function mostrarTela(tela){
  formLogin.classList.toggle('hidden', tela!=='login');
  linkEsqueci.classList.toggle('hidden', tela!=='login');
  formEsqueci.classList.toggle('hidden', tela!=='esqueci');
  formNovaSenha.classList.toggle('hidden', tela!=='novaSenha');
  setStatus('');
}

linkEsqueci.addEventListener('click',function(){
  document.getElementById('emailRecup').value=document.getElementById('email').value||'';
  mostrarTela('esqueci');
});
document.getElementById('btnVoltarLogin').addEventListener('click',function(){ mostrarTela('login'); });

formEsqueci.addEventListener('submit',async function(e){
  e.preventDefault();
  var email=document.getElementById('emailRecup').value;
  var btn=document.getElementById('btnEsqueci');
  btn.disabled=true;
  setStatus('Enviando...','');
  var res=await sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+window.location.pathname});
  btn.disabled=false;
  if(res.error){ setStatus('Erro: '+res.error.message,'err'); return; }
  // Resposta identica exista ou nao o e-mail (padrao do Supabase) - evita confirmar pra quem
  // esta tentando adivinhar e-mails cadastrados se o servico realmente enviou ou nao.
  setStatus('Se esse e-mail estiver cadastrado, um link de recuperação foi enviado.','ok');
});

formNovaSenha.addEventListener('submit',async function(e){
  e.preventDefault();
  var novaSenha=document.getElementById('novaSenha').value;
  var btn=document.getElementById('btnNovaSenha');
  btn.disabled=true;
  setStatus('Salvando...','');
  var res=await sb.auth.updateUser({password:novaSenha});
  if(res.error){ setStatus('Erro ao salvar: '+res.error.message,'err'); btn.disabled=false; return; }
  setStatus('Senha alterada com sucesso! Entrando...','ok');
  await openPortal();
});

sb.auth.onAuthStateChange(function(event){
  if(event==='PASSWORD_RECOVERY') mostrarTela('novaSenha');
});

tryAutoLogin();
</script>
</body>
</html>
