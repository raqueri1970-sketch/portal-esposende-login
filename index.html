<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Portal Esposende</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#02060d;color:#fff;font-family:Inter,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
#status{font-size:13px;color:#6b88a8}
#status.err{color:#ff3355}
#portalFrame{display:none;position:fixed;inset:0;width:100vw;height:100vh;border:none;z-index:9999;background:#02060d}
body.portal-on{display:block;padding:0}
body.portal-on #status{display:none}
</style>
</head>
<body>
<div id="status">Abrindo o portal...</div>
<iframe id="portalFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-downloads allow-modals allow-popups allow-top-navigation-by-user-activation allow-popups-to-escape-sandbox"></iframe>
<script>
// Sem tela de login por decisão do Ricardo (2026-08-09) — acesso direto pelo link.
// URL assinada de longa duração (10 anos) pro arquivo no bucket privado do Supabase Storage;
// não precisa de sessão/autenticação pra abrir.
// Aponta pra um NOME DE ARQUIVO NOVO a cada deploy — não reaproveitar "PORTAL_ESPOSENDE_V4.html".
// O storage-api do Supabase manda "Expires" igual ao "exp" do token assinado, então uma URL
// de vida longa (10 anos) fica cacheada por CDN pelo mesmo prazo — sobrescrever o objeto NÃO
// invalida esse cache. Único jeito confiável de publicar uma atualização é subir com um nome
// de objeto diferente (o path faz parte da chave de cache) e trocar essa URL aqui. Ver
// C:\Users\controladoria\.claude\skills\sistema-de-inventario\SKILL.md pra mais contexto.
var FILE_URL='https://rdztzurfesnobfkazgpm.supabase.co/storage/v1/object/sign/portal-file/PORTAL_ESPOSENDE_V4_20260813f.html?token=eyJraWQiOiJzdG9yYWdlLXVybC1zaWduaW5nLWtleV9iZjhkMGUwYy00NmIzLTRiODAtOWMzZC1jN2FkNzY4N2U2YzAiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJwb3J0YWwtZmlsZS9QT1JUQUxfRVNQT1NFTkRFX1Y0XzIwMjYwODEzZi5odG1sIiwic2NvcGUiOiJkb3dubG9hZCIsImlhdCI6MTc4NjYzMjM2NywiZXhwIjoyMTAxOTkyMzY3fQ.Stg_ZiGgwzj2zgyz11sB6GgIUOkGTXSQgjDyf6GBgZM';

function setStatus(msg,cls){
  var el=document.getElementById('status');
  if(el){ el.textContent=msg; el.className=cls||''; }
}

// Marca que o usuário já começou a mexer (clique/tecla) — usado só pra não
// recarregar sozinho embaixo de alguém no meio de um upload/formulário.
window.__portalUserActive = false;
['pointerdown','keydown'].forEach(function(ev){
  window.addEventListener(ev, function(){ window.__portalUserActive = true; }, {capture:true, passive:true});
});

var CACHE_DB='portal_cache_v1',CACHE_STORE='files',CACHE_KEY='portal';
function cacheOpen(){
  return new Promise(function(resolve,reject){
    var req=indexedDB.open(CACHE_DB,1);
    req.onupgradeneeded=function(){ req.result.createObjectStore(CACHE_STORE); };
    req.onsuccess=function(){ resolve(req.result); };
    req.onerror=function(){ reject(req.error); };
  });
}
function cacheGet(key){
  return cacheOpen().then(function(db){
    return new Promise(function(resolve){
      try{
        var tx=db.transaction(CACHE_STORE,'readonly');
        var rq=tx.objectStore(CACHE_STORE).get(key);
        rq.onsuccess=function(){ resolve(rq.result||null); };
        rq.onerror=function(){ resolve(null); };
      }catch(e){ resolve(null); }
    });
  }).catch(function(){ return null; });
}
function cacheSet(key,val){
  return cacheOpen().then(function(db){
    return new Promise(function(resolve){
      try{
        var tx=db.transaction(CACHE_STORE,'readwrite');
        tx.objectStore(CACHE_STORE).put(val,key);
        tx.oncomplete=function(){ resolve(true); };
        tx.onerror=function(){ resolve(false); };
      }catch(e){ resolve(false); }
    });
  }).catch(function(){ return false; });
}

function showPortalHtml(html){
  var blob=new Blob([html],{type:'text/html;charset=utf-8'});
  var blobUrl=URL.createObjectURL(blob);
  var ifr=document.getElementById('portalFrame');
  ifr.src=blobUrl;
  ifr.style.display='block';
  document.body.classList.add('portal-on');
}

async function downloadFreshPortal(){
  var res=await fetch(FILE_URL,{cache:'no-store'});
  if(!res.ok)throw new Error('status '+res.status);
  return await res.text();
}

async function checkVersion(){
  // ETag não é lido por fetch() cross-origin (servidor não manda
  // Access-Control-Expose-Headers pra ele) — usa Last-Modified, que é um dos
  // poucos headers liberados por padrão pelo CORS mesmo sem essa config.
  try{
    var res=await fetch(FILE_URL,{method:'HEAD',cache:'no-store'});
    return res.headers.get('Last-Modified');
  }catch(e){ return null; }
}

async function openPortal(){
  var cached=await cacheGet(CACHE_KEY);

  if(cached){
    // Mostra o cache local na hora — sem esperar rede nenhuma.
    showPortalHtml(cached.html);
    setStatus('Portal aberto (cache local). Verificando atualização...','');
    var ver=await checkVersion();
    if(ver && ver===cached.ver){
      setStatus('Portal aberto (atualizado).','');
      return;
    }
    // Versão diferente (ou não deu pra checar) — baixa em segundo plano e recarrega
    // sozinho. Antes pedia pra apertar F5 manualmente — a maioria não via o aviso e
    // ficava com a versão antiga (foi o que aconteceu com o RH quebrado 09/08/2026).
    // Só recarrega se o usuário ainda não mexeu em nada (sem cliques/digitação) nos
    // primeiros segundos — evita interromper alguém já preenchendo um upload.
    try{
      var freshHtml=await downloadFreshPortal();
      cacheSet(CACHE_KEY,{html:freshHtml,ver:ver||null,savedAt:new Date().toISOString()});
      if(!window.__portalUserActive){
        setStatus('Nova versão encontrada — atualizando...','');
        setTimeout(function(){ location.reload(); },600);
      }else{
        setStatus('Nova versão do portal disponível — atualize a página (F5) pra carregar.','');
      }
    }catch(e){
      setStatus('Portal aberto (cache local).','');
    }
    return;
  }

  // Sem cache (primeiro acesso neste navegador) — precisa baixar antes de mostrar algo.
  setStatus('Abrindo o portal...','');
  try{
    var html=await downloadFreshPortal();
    showPortalHtml(html);
    setStatus('Portal aberto.','');
    var ver2=await checkVersion();
    cacheSet(CACHE_KEY,{html:html,ver:ver2,savedAt:new Date().toISOString()});
  }catch(e){
    setStatus('Erro ao abrir o portal: '+e.message,'err');
  }
}

openPortal();
</script>
</body>
</html>
