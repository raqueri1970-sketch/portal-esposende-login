      // Os mínimos gravados anteriormente foram calculados pela regra antiga e

      if(typeof w.alterarMetaCobertura==='function'){

          try{w.eval('estoqueMinOverrides = {}')}catch(e){}

      w.__almoxMinimoSegurancaVersao=VERSAO;
      w.atualizarPainelEstoque();
      if(typeof w.salvarCacheAlm==='function')w.salvarCacheAlm();

  function numeroPtBr(txt){
    var m=String(txt||'').match(/[\d.]+(?:,\d{1,2})?/);
    return m?Number(m[0].replace(/\./g,'').replace(',','.'))||0:0;

  function dinheiroPtBr(n){

  function codigoLoja(txt){
    var m=String(txt||'').trim().match(/^(\d+)/);

  function acharCard(doc,rotulo){

      var selLoja=selects.find(function(s){return /TODAS AS LOJAS ATIVAS/i.test(s.textContent||'')});

      var lojasAtivas=null,lojaEscolhida='';
      var cbsLoja=Array.from(doc.querySelectorAll('.cb-loja-item'));
      var lojasMarcadas=cbsLoja.length?new Set(cbsLoja.filter(function(cb){return cb.checked}).map(function(cb){return codigoLoja(cb.value)})):null;
      if(selLoja){
        lojaEscolhida=String(selLoja.options[selLoja.selectedIndex]?.text||'');
        if(/TODAS AS LOJAS ATIVAS/i.test(lojaEscolhida)){
          lojasAtivas=new Set(Array.from(selLoja.options).slice(1).map(function(o){return codigoLoja(o.text||o.value)}).filter(Boolean));
          if(!lojasAtivas.size)lojasAtivas=null;

      var gerente=selGer?String(selGer.options[selGer.selectedIndex]?.text||''):'';
      var insumo=selIns?String(selIns.options[selIns.selectedIndex]?.text||''):'';
      var regMap=w.eval("typeof dbRegionaisMap!=='undefined'?dbRegionaisMap:{}");
      var total=0;
      rows.forEach(function(r){

        if(!d||isNaN(d.getTime())||(ini&&d<ini)||(fim&&d>fim))return;

          if(lojasAtivas&&!lojasAtivas.has(cod))return;

      if(secoes.length){

// Caminho novo (2026-08-19): o antigo 'PORTAL_ESPOSENDE_V4.html' tinha uma URL assinada de
// 10 anos publica no historico do repo GitHub Pages, que continuaria funcionando pra sempre
// mesmo com o login de volta. Trocado de caminho (e o objeto antigo removido do Storage) pra
// invalidar aquele acesso — URLs assinadas antigas ficam presas ao caminho, nao ao conteudo.
var FILE_PATH='PORTAL_ESPOSENDE_V4_AUTH.html';

function setStatus(msg,cls){
  var el=document.getElementById('status');
  el.textContent=msg;el.className=cls||'';
}

// O Supabase Storage força Content-Type text/plain + CSP sandbox em qualquer
// arquivo (proteção deles contra hospedar HTML executável direto). Por isso
// buscamos o conteúdo via fetch() autenticado e montamos um Blob local — o
// mesmo truque que o próprio portal já usa pros módulos (getBlobUrl/execMod).
async function openPortal(){
  setStatus('Abrindo o portal...','ok');
  var res=await sb.storage.from(BUCKET).createSignedUrl(FILE_PATH,3600);
  if(res.error){ setStatus('Erro ao abrir o portal: '+res.error.message,'err'); return; }
  var fileRes=await fetch(res.data.signedUrl);
  if(!fileRes.ok){ setStatus('Erro ao baixar o portal (status '+fileRes.status+')','err'); return; }
  var html=await fileRes.text();
  // Identidade do usuário logado para os módulos (ex.: Orçamento & Compras — só o
  // Administrador altera a verba). Injeta a sessão Auth ANTES de qualquer script do
  // shell rodar. Nenhum dado sai daqui; fica só no iframe do portal, mesma origem.
  var _sessionPayload=null;
  try{
    var _s=(await sb.auth.getSession()).data.session;
    if(_s&&_s.access_token){
      _sessionPayload={
        access_token:_s.access_token, refresh_token:_s.refresh_token||'',
        email:(_s.user&&_s.user.email)||null, uid:(_s.user&&_s.user.id)||null
      };
      var _inj='<scr'+'ipt>window.__PORTAL_SESSION='+JSON.stringify(_sessionPayload)+';</scr'+'ipt>';
      html=html.replace(/<\/head>/i,_inj+'</head>');
    }
  }catch(e){ console.warn('injeção da sessão falhou',e); }
  // Pré-carrega a Central no mesmo documento do Portal. Isso evita que navegadores
  // bloqueiem o iframe interno e garante que a sessão chegue antes do primeiro script.
  try{
    var _orcRes=await fetch('orcamento-compras.html?v=central-unica-2',{cache:'no-store'});
    if(!_orcRes.ok)throw new Error('status '+_orcRes.status);
    var _orcHtml=await _orcRes.text();
    if(_sessionPayload){
      var _orcSession='<scr'+'ipt>window.__PORTAL_SESSION='+JSON.stringify(_sessionPayload)+';</scr'+'ipt>';
      _orcHtml=_orcHtml.replace(/<\/head>/i,_orcSession+'</head>');
    }
    var _orcJson=JSON.stringify(_orcHtml).replace(/<\/script/gi,'<\\/script');
    var _orcInj='<scr'+'ipt>window.__ORC_UNIFIED_HTML='+_orcJson+';</scr'+'ipt>';
    html=html.replace(/<\/head>/i,_orcInj+'</head>');
  }catch(e){ console.warn('pré-carga da Central falhou',e); }
  // Ao clicar no módulo Orçamento & Compras, abre a interface unificada no próprio Portal.
  html=html.replace(/<\/body>/i,ORC_UNIFIED_PATCH+'</body>');
  // Correção isolada da regra do Almoxarifado. Não altera HTML, cards ou gráficos.
  html=html.replace(/<\/body>/i,ALMOX_MINIMO_PATCH+'</body>');
  var blob=new Blob([html],{type:'text/html;charset=utf-8'});
  var blobUrl=URL.createObjectURL(blob);
  var ifr=document.getElementById('portalFrame');
  ifr.src=blobUrl;
  ifr.style.display='block';
  document.body.classList.add('portal-on');
}

async function tryAutoLogin(){
  var res=await sb.auth.getSession();
  if(res.data&&res.data.session){ openPortal(); return true; }
  return false;
}

  var email=document.getElementById('email').value;
  var password=document.getElementById('password').value;
  var btn=document.getElementById('btn');
  btn.disabled=true;
  setStatus('Entrando...','');
  var res=await sb.auth.signInWithPassword({email:email,password:password});
  if(res.error){ setStatus('Login inválido: '+res.error.message,'err'); btn.disabled=false; return; }
  await openPortal();
});
