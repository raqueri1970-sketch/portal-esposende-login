<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Caixa de Revisão · Auditoria Financeira</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><style>:root{--bg:#070b16;--card:#0f172a;--line:#26334d;--txt:#eef2fb;--mut:#9fb0cf;--blue:#2563eb;--green:#15803d;--red:#ef4444;--yellow:#f59e0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:18px;max-width:1200px;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:22px;margin:0}.sub{color:var(--mut);margin-top:5px}.btn{border:1px solid var(--line);background:#17233b;color:#fff;padding:10px 13px;border-radius:10px;font-weight:700;cursor:pointer}.blue{background:var(--blue)}.green{background:var(--green)}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-top:12px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.k{text-align:center}.k b{display:block;font-size:24px}.k span{color:var(--mut);font-size:12px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}input,select,textarea{background:#0a1222;color:#fff;border:1px solid var(--line);border-radius:9px;padding:10px}input{flex:1;min-width:190px}.case{border-left:4px solid var(--yellow)}.case.crit{border-left-color:var(--red)}.head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.money{font-size:21px;font-weight:800}.mut{color:var(--mut)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.box{background:#0a1222;border:1px solid var(--line);border-radius:10px;padding:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}textarea{width:100%;min-height:58px;margin-top:10px}.chip{font-size:11px;border:1px solid var(--line);border-radius:99px;padding:3px 8px}.photos{display:flex;gap:8px;overflow:auto;margin-top:8px}.photo{min-width:150px}.photo img{width:150px;height:150px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}.empty{text-align:center;color:var(--mut);padding:40px}.login{max-width:400px;margin:60px auto}.login input{width:100%;margin:5px 0}.hidden{display:none!important}@media(max-width:650px){.kpis{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.actions .btn{flex:1}}</style></head><body><div id="login" class="login hidden"><h1>Caixa de Revisão</h1><div class="sub">Use o mesmo acesso do Portal.</div><input id="email" type="email" placeholder="Email"><input id="senha" type="password" placeholder="Senha"><button class="btn blue" style="width:100%" onclick="entrar()">Entrar</button><div id="err" class="sub"></div></div><div id="app" class="hidden"><div class="top"><div><h1>📥 Caixa de Revisão Financeira</h1><div class="sub">Analise a evidência. Ao marcar <b>Resolvido</b>, o caso sai automaticamente desta caixa, mas permanece no histórico.</div></div><div><a class="btn" href="index.html">← Auditoria Financeira</a> <button class="btn" onclick="carregar()">↻ Atualizar</button></div></div><div class="kpis"><div class="card k"><b id="nTotal">—</b><span>Para revisar</span></div><div class="card k"><b id="nCrit">—</b><span>Críticos</span></div><div class="card k"><b id="vRisco">—</b><span>Valor crítico indicado</span></div></div><div class="filters"><input id="q" placeholder="Buscar fornecedor, documento ou prova" oninput="render()"><select id="nivel" onchange="render()"><option value="">Todos</option><option>PAGO_A_MAIS</option><option>SUSPEITA</option><option>EXPLICADO</option></select></div><div id="lista"><div class="empty">Carregando…</div></div></div><script>const URL='https://rdztzurfesnobfkazgpm.supabase.co',KEY='sb_publishable_4LHSO4TrP7F4m4tpJyH44g_BGmfC92h';const sb=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'fin-auditoria-auth'}});let casos=[],user='';const $=x=>document.getElementById(x),brl=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function iniciar(){const s=(await sb.auth.getSession()).data.session;if(!s)return $('login').classList.remove('hidden');const ok=await sb.rpc('fin_pode_auditar');if(ok.data!==true){await sb.auth.signOut();$('login').classList.remove('hidden');$('err').textContent='Usuário sem acesso à Auditoria Financeira.';return}user=(await sb.auth.getUser()).data.user?.email||'';$('app').classList.remove('hidden');carregar()}async function entrar(){const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('senha').value});if(r.error){$('err').textContent='Email ou senha incorretos.';return}$('login').classList.add('hidden');iniciar()}async function carregar(){const r=await sb.from('fin_duplicidade_fila_revisao').select('*');if(r.error){$('lista').innerHTML='<div class="empty">Falha ao carregar: '+esc(r.error.message)+'</div>';return}casos=r.data||[];$('nTotal').textContent=casos.length;$('nCrit').textContent=casos.filter(x=>x.nivel==='PAGO_A_MAIS').length;$('vRisco').textContent=brl(casos.filter(x=>x.nivel==='PAGO_A_MAIS').reduce((s,x)=>s+Number(x.valor_a_mais||0),0));render()}function render(){let a=casos;const q=$('q').value.toLowerCase().trim(),n=$('nivel').value;if(n)a=a.filter(x=>x.nivel===n);if(q)a=a.filter(x=>[x.fornecedor,x.documento,x.prova].join(' ').toLowerCase().includes(q));$('lista').innerHTML=a.length?a.map(card).join(''):'<div class="empty">Nenhum caso nesta fila.</div>';a.forEach(x=>fotos(x.id))}function card(x){const crit=x.nivel==='PAGO_A_MAIS';return `<div class="card case ${crit?'crit':''}" id="c${x.id}"><div class="head"><div><span class="chip">${esc(x.nivel)}</span> <b>${esc(x.fornecedor||'Fornecedor não identificado')}</b><div class="mut">Documento: ${esc(x.documento||'—')} · Datas: ${esc((x.datas||[]).join(', '))}</div></div><div class="money">${brl(crit?(x.valor_a_mais||x.valor):x.valor)}</div></div><div class="grid"><div class="box"><b>O que o agente encontrou</b><div class="mut">${esc(x.prova||'Sem descrição adicional')}</div><div>Quantidade: <b>${x.qtd}</b> · Valor unitário: <b>${brl(x.valor)}</b></div></div><div class="box"><b>Evidências / comprovantes</b><div class="photos" id="f${x.id}"><span class="mut">Buscando…</span></div></div></div><textarea id="o${x.id}" placeholder="Sua observação (opcional)">${esc(x.revisao_observacao||'')}</textarea><div class="actions"><button class="btn blue" onclick="acao(${x.id},'revisar')">↻ Revisar / manter na caixa</button><button class="btn green" onclick="acao(${x.id},'resolvido')">✓ Resolvido · retirar da auditoria</button></div></div>`}async function fotos(id){const r=await sb.from('fin_evidencias').select('*').eq('ocorrencia_id','DUP-COMP-'+id);const el=$('f'+id);if(!el)return;if(r.error||!r.data?.length){el.innerHTML='<span class="mut">Sem foto vinculada neste caso.</span>';return}let h='';for(const e of r.data){if(!e.arquivo_path){h+=`<div class="photo mut">${esc(e.tipo||'evidência')}</div>`;continue}const s=await sb.storage.from(e.storage_bucket||'fin-comprovantes').createSignedUrl(e.arquivo_path,600);const u=s.data?.signedUrl;if(u&&/\.(jpg|jpeg|png|webp)$/i.test(e.arquivo_path))h+=`<a class="photo" href="${u}" target="_blank"><img src="${u}"><div class="mut">${esc(e.lado||'')} ${esc(e.arquivo_nome||'')}</div></a>`;else if(u)h+=`<a class="btn" href="${u}" target="_blank">📄 ${esc(e.arquivo_nome||'Comprovante')}</a>`}el.innerHTML=h||'<span class="mut">Evidência registrada sem arquivo visual.</span>'}async function acao(id,a){if(a==='resolvido'&&!confirm('Marcar como resolvido e retirar este caso da caixa de auditoria?'))return;const obs=$('o'+id)?.value||'';const r=await sb.rpc('fin_revisar_duplicidade',{p_id:id,p_acao:a,p_observacao:obs});if(r.error){alert('Não foi possível salvar: '+r.error.message);return}if(a==='resolvido'){casos=casos.filter(x=>x.id!==id);$('c'+id)?.remove();$('nTotal').textContent=casos.length;$('nCrit').textContent=casos.filter(x=>x.nivel==='PAGO_A_MAIS').length;$('vRisco').textContent=brl(casos.filter(x=>x.nivel==='PAGO_A_MAIS').reduce((s,x)=>s+Number(x.valor_a_mais||0),0))}else{alert('Caso mantido para revisão.')}}iniciar();</script></body></html>
