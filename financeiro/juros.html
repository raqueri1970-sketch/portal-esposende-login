<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Juros e Atrasos · Auditoria Financeira</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><style>:root{--bg:#070b16;--card:#0f172a;--line:#26334d;--txt:#eef2fb;--mut:#9fb0cf;--bad:#ef4444;--warn:#f59e0b;--blue:#2563eb}*{box-sizing:border-box}body{margin:auto;max-width:1250px;padding:18px;background:var(--bg);color:var(--txt);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top,.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-top:12px}.btn,input{border:1px solid var(--line);background:#17233b;color:#fff;border-radius:9px;padding:9px 11px;font-weight:700}.btn{cursor:pointer;text-decoration:none}.btn.on{background:var(--blue)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.k{text-align:center}.k b{display:block;font-size:23px}.mut{color:var(--mut)}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mut);font-size:11px;text-transform:uppercase}.num{text-align:right}.bar{height:9px;background:#1e293b;border-radius:5px;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--bad)}.hidden{display:none}.login{max-width:400px;margin:60px auto}.login input{width:100%;margin:5px 0}.warn{border-left:3px solid var(--warn)}</style></head><body>

<script>
const URL='https://rdztzurfesnobfkazgpm.supabase.co',KEY='sb_publishable_4LHSO4TrP7F4m4tpJyH44g_BGmfC92h',NO_PORTAL=/github\.io$/.test(location.hostname),sb=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,...(NO_PORTAL?{}:{storageKey:'fin-auditoria-auth'})}}),$=x=>document.getElementById(x),brl=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function carregar(){const de=$('de').value,ate=$('ate').value;if(!de||!ate||de>ate)return;const fonteDe=addDays(de,-365);$('out').innerHTML='<div class="card mut">Buscando pagamentos e vencimentos no Sallamo…</div>';const ses=(await sb.auth.getSession()).data.session;if(!ses)return;const r=await fetch(`${URL}/functions/v1/financeiro-sallamo?dataInicio=${fonteDe}&dataFim=${ate}`,{headers:{Authorization:'Bearer '+ses.access_token,apikey:KEY}}),j=await r.json();if(!r.ok){$('out').innerHTML='<div class="card">Falha: '+esc(j.erro||r.status)+'</div>';return}
const rows=(j.dados||[]).map(x=>{const pag=String(x.dataPagamento||'').slice(0,10),venc=String(x.vencimento||'').slice(0,10),d=pag&&venc?dias(pag,venc):0,par=val(x.valorParcela),pago=val(x.valorPago),exp=val(x.juros)+val(x.valorJuros)+val(x.multa)+val(x.valorMulta),acr=Math.max(0,pago-par),custo=exp>0?exp:acr;return{x,pag,venc,d,par,pago,custo,confirmado:exp>0,fonte:exp>0?'Juros/multa informado pelo Sallamo':(acr>0?'Acréscimo detectado (pago − parcela)':'Sem custo identificado')}}).filter(z=>z.pag>=de&&z.pag<=ate&&z.d>0).sort((a,b)=>b.custo-a.custo||b.d-a.d);
