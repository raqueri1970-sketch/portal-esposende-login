<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>@font-face{font-family:"SA Montserrat";font-weight:800;src:url(data:font/woff2;base64,) format("woff2")}</style>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#1552b8"/>
      <stop offset="0.55" stop-color="#0a2d66"/>
      <stop offset="1" stop-color="#050f24"/>
    </radialGradient>
    <linearGradient id="gota" x1="0.25" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#8cc8ff"/>
      <stop offset="0.45" stop-color="#2a7bf0"/>
      <stop offset="1" stop-color="#0a3596"/>
    </linearGradient>
    <radialGradient id="sombraInt" cx="62%" cy="72%" r="60%">
      <stop offset="0.55" stop-color="#021a55" stop-opacity="0"/>
      <stop offset="1" stop-color="#021a55" stop-opacity=".55"/>
    </radialGradient>
    <linearGradient id="brilho" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="texto" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9cc9ff"/>
    </linearGradient>
    <filter id="halo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="neon" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sombra" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000814" flood-opacity=".6"/>
    </filter>
    <path id="g" d="M256 58 C256 58 136 194 136 276 C136 344 190 396 256 396 C322 396 376 344 376 276 C376 194 256 58 256 58 Z"/>
    <clipPath id="clipG"><use href="#g"/></clipPath>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- ondas de pulso -->
  <g fill="none" stroke="#5fa8ff" stroke-width="2">
    <circle cx="256" cy="262" r="168" stroke-opacity=".16"/>
    <circle cx="256" cy="262" r="206" stroke-opacity=".09"/>
    <circle cx="256" cy="262" r="244" stroke-opacity=".05"/>
  </g>
  <!-- halo -->
  <use href="#g" fill="#2f86ff" opacity=".55" filter="url(#halo)"/>

  <!-- gota -->
  <g filter="url(#sombra)">
    <use href="#g" fill="url(#gota)"/>
    <use href="#g" fill="url(#sombraInt)"/>
  </g>
  <g clip-path="url(#clipG)">
    <ellipse cx="206" cy="210" rx="34" ry="78" transform="rotate(28 206 210)" fill="url(#brilho)" opacity=".75"/>
    <circle cx="300" cy="340" r="10" fill="#fff" opacity=".25"/>
  </g>
  <use href="#g" fill="none" stroke="#dcebff" stroke-width="7" stroke-opacity=".9"/>

  <!-- batimento -->
  <polyline points="116,300 196,300 216,262 240,338 268,226 290,300 396,300"
            fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon)"/>
  <circle cx="396" cy="300" r="9" fill="#fff" filter="url(#neon)"/>

  <!-- nome -->
  <text x="256" y="458" text-anchor="middle" font-family="'SA Montserrat', Montserrat, 'Segoe UI', Arial, sans-serif"
        font-weight="800" font-size="44" letter-spacing="5" fill="url(#texto)">SANGUE AZUL</text>
</svg>
