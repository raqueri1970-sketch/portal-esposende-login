<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auditoria — Entrada de Estoque</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#edf4fb;font-family:Arial,sans-serif}.top{padding:18px 20px;background:#081421;border-bottom:1px solid #20334b}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#0b1828;border:1px solid #20334b;border-radius:14px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.k{color:#9fb3c8;font-size:12px}.v{font-size:20px;font-weight:bold;margin-top:4px}input,select,button{padding:10px;border-radius:8px;border:1px solid #315170;background:#07111f;color:#fff}button{background:#2477e8;border:0;font-weight:bold}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.row{border-top:1px solid #20334b;padding:12px 0;display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1.5fr;gap:8px;font-size:13px}.bad{color:#f7c66b}.ok{color:#62d69f}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr 1fr}}</style></head><body><div class="top"><b>Auditoria — Entrada de Estoque</b></div><div class="wrap"><div class="grid"><div class="card"><div class="k">Solicitações</div><div class="v" id="total">—</div></div><div class="card"><div class="k">Concluídas</div><div class="v" id="concl">—</div></div><div class="card"><div class="k">Não comprovadas</div><div class="v" id="ncomp">—</div></div><div class="card"><div class="k">Erros / divergências</div><div class="v" id="erros">—</div></div></div><div class="card"><div class="filters"><input id="loja" placeholder="Loja"><input id="produto" placeholder="Produto"><select id="status"><option value="">Todos os status</option><option>PENDENTE_EXECUCAO_SETA</option><option>CONCLUIDO</option><option>ERRO</option><option>CANCELADO</option></select><button onclick="carregar()">Atualizar</button><button onclick="window.print()">Imprimir / PDF</button></div><div id="lista">Carregando…</div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient('https://rdztzurfesnobfkazgpm.supabase.co','sb_publishable_U7sAB7YMWRpNfsjZwobYgQ_vM0FmE9h');
async function carregar(){const {data:{session}}=await sb.auth.getSession();if(!session){document.getElementById('lista').textContent='Entre pelo Portal para visualizar a auditoria.';return}let q=sb.from('entrada_estoque').select('id,loja,produto,quantidade,estoque_atual,novo_estoque,motivo,produto_com_defeito,comprovado,status,codigo_seta,nome_loja_seta,loja_seta_confirmada,etapa_executor,seta_retorno,criado_em,executado_em').order('criado_em',{ascending:false}).limit(500);let l=document.getElementById('loja').value.trim(),p=document.getElementById('produto').value.trim(),s=document.getElementById('status').value;if(l)q=q.eq('loja',l);if(p)q=q.eq('produto',p);if(s)q=q.eq('status',s);const {data,error}=await q;if(error){document.getElementById('lista').textContent='Erro ao carregar: '+error.message;return}document.getElementById('total').textContent=data.length;document.getElementById('concl').textContent=data.filter(x=>x.status==='CONCLUIDO').length;document.getElementById('ncomp').textContent=data.filter(x=>!x.comprovado).length;document.getElementById('erros').textContent=data.filter(x=>x.status==='ERRO'||x.etapa_executor==='BLOQUEADO_DIVERGENCIA').length;document.getElementById('lista').innerHTML=data.length?data.map(x=>'<div class="row"><div><b>Loja '+esc(x.loja)+'</b><br><span class="k">Seta: '+esc(x.codigo_seta||'—')+(x.loja_seta_confirmada?' ✓':'')+'</span></div><div>Produto '+esc(x.produto)+'<br>Qtd. '+x.quantidade+'</div><div>Estoque '+x.estoque_atual+' → '+x.novo_estoque+'</div><div class="'+(x.comprovado?'ok':'bad')+'">'+(x.comprovado?'Comprovado':'Não comprovado')+'<br>'+esc(x.status)+'</div><div>'+new Date(x.criado_em).toLocaleString('pt-BR')+'<br><span class="k">'+esc(x.motivo)+' · '+esc(x.etapa_executor||'—')+'</span></div></div>').join(''):'Nenhum registro.'}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}carregar();</script></body></html>
