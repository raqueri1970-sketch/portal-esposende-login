<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Permissões de Treinamento</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;background:#0a0f1e;color:#fff;margin:0}.w{max-width:900px;margin:auto;padding:24px}.p{background:#131b30;padding:18px;border-radius:14px;margin:14px 0}select,input,button{padding:12px;border-radius:9px;margin:5px;background:#0d1428;color:#fff;border:1px solid #334}button{cursor:pointer}.areas{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.areas label{padding:10px;background:#0d1428;border-radius:9px}.ok{background:#38bdf8;color:#04121f}</style></head><body><div class="w"><h1>Permissões de Treinamento</h1><div class="p"><h3>Por cargo</h3><select id="cargo"></select><div id="ac" class="areas"></div><button class="ok" id="sc">Salvar cargo</button></div><div class="p"><h3>Exceção por CPF</h3><input id="cpf" placeholder="CPF"><button id="bc">Buscar</button><p id="pessoa"></p><div id="ap" class="areas"></div><button class="ok" id="sp" disabled>Salvar CPF</button></div><p id="msg"></p></div><script>
const sb=supabase.createClient('https://rdztzurfesnobfkazgpm.supabase.co','sb_publishable_4LHSO4TrP7F4m4tpJyH44g_BGmfC92h');let areas=[],cpfAtual='';
const box=(el,sel=[])=>{el.textContent='';areas.forEach(a=>{let l=document.createElement('label'),i=document.createElement('input');i.type='checkbox';i.value=a.id;i.checked=sel.includes(a.id);l.append(i,document.createTextNode(' '+a.nome));el.append(l)})};
const marcados=el=>[...el.querySelectorAll('input:checked')].map(x=>x.value);
async function rpc(n,p){let r=await sb.rpc(n,p||{});if(r.error)throw r.error;return r.data}
async function init(){let s=await sb.auth.getSession();if(!s.data.session){msg.textContent='Entre no Portal com uma conta administrativa antes de usar esta tela.';return}let r=await sb.from('curso_areas').select('id,nome,ordem').eq('ativo',true).order('ordem');if(r.error)throw r.error;areas=r.data;box(ac);box(ap);let cs=await rpc('curso_admin_cargos');cargo.innerHTML='<option value="">Selecione o cargo</option>';cs.forEach(x=>{let o=document.createElement('option');o.value=x.cargo;o.textContent=x.cargo+' ('+x.qtd+')';cargo.append(o)})}
cargo.onchange=async()=>{if(!cargo.value)return box(ac);let r=await rpc('curso_admin_regras',{p_tipo:'cargo',p_regra:cargo.value});box(ac,r.filter(x=>x.permitido).map(x=>x.area_id))};
sc.onclick=async()=>{if(!cargo.value)return;await rpc('curso_admin_salvar_cargo',{p_cargo:cargo.value,p_areas:marcados(ac)});msg.textContent='Permissões do cargo salvas.'};
bc.onclick=async()=>{let d=cpf.value.replace(/\D/g,'');if(d.length!==11){msg.textContent='CPF inválido.';return}let p=await rpc('curso_admin_pessoa',{p_cpf:d});if(!p.length){msg.textContent='CPF não encontrado na Base Mãe.';return}cpfAtual=d;pessoa.textContent=p[0].nome+' — '+(p[0].cargo||'sem cargo')+' — Loja '+(p[0].loja_codigo||'');let r=await rpc('curso_admin_regras_cpf',{p_cpf:d});box(ap,r.filter(x=>x.definido&&x.permitido).map(x=>x.area_id));sp.disabled=false;msg.textContent='Marque os módulos liberados para este CPF.'};
sp.onclick=async()=>{if(!cpfAtual)return;await rpc('curso_admin_salvar_cpf',{p_cpf:cpfAtual,p_areas:marcados(ap)});msg.textContent='Autorização individual salva.'};
init().catch(e=>msg.textContent=e.message);
</script></body></html>
