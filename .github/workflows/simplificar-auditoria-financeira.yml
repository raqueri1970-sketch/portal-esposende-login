name: Simplificar Auditoria Financeira

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/simplificar-auditoria-financeira.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar revisao e painel de juros
        shell: python
        run: |
          from pathlib import Path

          p=Path('financeiro/revisao.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Ao marcar <b>Resolvido</b>, o caso sai automaticamente desta caixa, mas permanece no histórico.','Dê a decisão do auditor. Casos confirmados ou descartados saem da fila ativa e ficam no histórico.')
          old='<div class="actions"><button class="btn blue" onclick="acao(${x.id},\'revisar\')">↻ Revisar / manter na caixa</button><button class="btn green" onclick="acao(${x.id},\'resolvido\')">✓ Resolvido · retirar da auditoria</button></div>'
          new='<div class="actions"><button class="btn blue" onclick="acao(${x.id},\'revisar\')">↻ Manter em análise</button><button class="btn green" onclick="acao(${x.id},\'confirmada\')">✓ Duplicidade confirmada</button><button class="btn" style="background:#475569" onclick="acao(${x.id},\'nao_duplicidade\')">✓ Não é duplicidade</button><button class="btn" onclick="acao(${x.id},\'resolvido\')">Encerrar caso</button></div>'
          if old in s: s=s.replace(old,new,1)
          s=s.replace("if(a==='resolvido'&&!confirm('Marcar como resolvido e retirar este caso da caixa de auditoria?'))return;","if(['confirmada','nao_duplicidade','resolvido'].includes(a)&&!confirm(a==='confirmada'?'Confirmar que este pagamento é duplicado?':a==='nao_duplicidade'?'Confirmar que NÃO é duplicidade? O caso sairá da auditoria ativa.':'Encerrar este caso?'))return;")
          s=s.replace("if(a==='resolvido'){casos=casos.filter(x=>x.id!==id);","if(['confirmada','nao_duplicidade','resolvido'].includes(a)){casos=casos.filter(x=>x.id!==id);")
          p.write_text(s,encoding='utf-8')

          p=Path('financeiro/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("['descontos', '🏷 Descontos e observações', R.ocorrencias.filter(o => o.regra === 'R20' || o.regra === 'R22').length]", "['juros', '⏱ Juros e atrasos'], ['descontos', '🏷 Descontos e observações', R.ocorrencias.filter(o => o.regra === 'R20' || o.regra === 'R22').length]",1)
          s=s.replace("({painel, duplicidade: duplicidadeAba, comprovantes: comprovantesAba, ocorrencias, fornecedores, despesas: despesasAba, descontos: descontosAba, centros, busca, regras})[ABA]();", "({painel, duplicidade: duplicidadeAba, comprovantes: comprovantesAba, ocorrencias, fornecedores, despesas: despesasAba, juros: jurosAba, descontos: descontosAba, centros, busca, regras})[ABA]();",1)
          marker='// ---------- PAINEL ----------'
          fn=r'''// ---------- JUROS E ATRASOS ----------
let JDIAS=30;
function jurosAba(){
  const fim=hojeISO(), ini=new Date(fim+'T12:00:00'); ini.setDate(ini.getDate()-JDIAS); const de=ini.toISOString().slice(0,10);
  const rows=R.titulos.filter(t=>t.pagamento&&t.pagamento>=de&&t.pagamento<=fim&&t.vencimento&&t.pagamento>t.vencimento).map(t=>{const dias=Math.max(0,Math.round((Date.parse(t.pagamento+'T12:00:00Z')-Date.parse(t.vencimento+'T12:00:00Z'))/86400000));const explicito=Number(t.juros||0)+Number(t.multa||0);const acresc=Math.max(0,Number(t.valorPago||0)-Number(t.valorParcela||0));return {...t,dias,custo:explicito>0?explicito:acresc,fonte:explicito>0?'juros/multa informado':'acréscimo pago'}}).filter(t=>t.dias>0).sort((a,b)=>b.custo-a.custo||b.dias-a.dias);
  const total=rows.reduce((a,t)=>a+t.custo,0), media=rows.length?rows.reduce((a,t)=>a+t.dias,0)/rows.length:0;
  const porDia=[1,2,3,5,10,9999].map((lim,i)=>{const ant=i?[1,2,3,5,10][i-1]:0,g=rows.filter(t=>t.dias>ant&&t.dias<=lim);return {nome:lim===9999?'mais de 10 dias':lim===1?'1 dia':`${ant+1} a ${lim} dias`,n:g.length,v:g.reduce((a,t)=>a+t.custo,0)}});
  $('corpo').innerHTML=`<h2>Juros, multas e pagamentos em atraso</h2><div class="row" style="margin-bottom:12px"><button class="btn ${JDIAS===7?'on':''}" onclick="JDIAS=7;render()">7 dias</button><button class="btn ${JDIAS===20?'on':''}" onclick="JDIAS=20;render()">20 dias</button><button class="btn ${JDIAS===30?'on':''}" onclick="JDIAS=30;render()">30 dias</button><button class="btn ${JDIAS===90?'on':''}" onclick="JDIAS=90;render()">90 dias</button></div><div class="grid">${kpi('Custo de juros/acréscimos',brl(total),`${n0(rows.length)} títulos pagos em atraso`,'k-bad')}${kpi('Atraso médio',media.toLocaleString('pt-BR',{maximumFractionDigits:1})+' dias',`período de ${JDIAS} dias`,'k-warn')}${kpi('Maior custo',brl(rows[0]?.custo||0),rows[0]?`${esc(rows[0].fornecedor)} · ${rows[0].dias} dias`:'sem ocorrências')}</div><div class="card" style="margin-top:12px"><h2 style="margin-top:0">Custo por dias de atraso</h2>${porDia.map(x=>`<div class="row" style="margin:7px 0"><span class="small" style="width:105px">${x.nome}</span><div class="bar" style="flex:1"><i style="width:${total?Math.max(1,x.v/total*100):0}%;background:var(--bad)"></i></div><span class="small num" style="width:150px">${brl(x.v)} · ${n0(x.n)}</span></div>`).join('')}</div><div class="tw" style="margin-top:12px"><table><tr><th>Pagamento</th><th>Fornecedor</th><th>Título</th><th>Vencimento</th><th class="num">Dias atraso</th><th class="num">Parcela</th><th class="num">Pago</th><th class="num">Custo</th><th>Leitura</th></tr>${rows.map(t=>`<tr><td>${dBRa(t.pagamento)}</td><td>${esc(t.fornecedor)}</td><td>${esc(t.codigo)}</td><td>${dBRa(t.vencimento)}</td><td class="num"><b>${t.dias}</b></td><td class="num">${brl(t.valorParcela)}</td><td class="num">${brl(t.valorPago)}</td><td class="num"><b>${brl(t.custo)}</b></td><td class="small mut">${t.fonte}</td></tr>`).join('')||'<tr><td colspan="9" class="mut" style="text-align:center;padding:25px">Nenhum pagamento em atraso no período.</td></tr>'}</table></div><div class="small mut" style="margin-top:8px">Quando Sallamo informa juros/multa, usamos o valor explícito. Sem esse campo, mostramos somente o acréscimo entre parcela e valor pago; não presumimos que todo acréscimo seja juros.</div>`;
}
'''
          if 'function jurosAba()' not in s: s=s.replace(marker,fn+'\n'+marker,1)
          p.write_text(s,encoding='utf-8')

      - name: Validar
        shell: bash
        run: |
          grep -Fq 'Duplicidade confirmada' financeiro/revisao.html
          grep -Fq 'Não é duplicidade' financeiro/revisao.html
          grep -Fq 'function jurosAba()' financeiro/index.html
          grep -Fq '20 dias' financeiro/index.html
          grep -Fq 'Custo por dias de atraso' financeiro/index.html

      - name: Publicar
        shell: bash
        run: |
          git config user.name 'Portal Esposende Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add financeiro/index.html financeiro/revisao.html
          git commit -m 'feat: decisao do auditor e busca de juros por periodo'
          git push origin HEAD:main
