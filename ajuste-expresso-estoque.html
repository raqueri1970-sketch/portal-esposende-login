<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#061224"><title>Ajuste Expresso de Estoque — Esposende</title>
<style>*{box-sizing:border-box}body{margin:0;background:#06101d;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{max-width:520px;margin:auto;padding:20px 16px 40px}.brand{font-size:12px;letter-spacing:1.5px;color:#76a8df;font-weight:800}.title{font-size:25px;font-weight:850;margin:7px 0 3px}.sub{color:#91a8c2;font-size:13px;margin-bottom:20px}.card{background:#0b1727;border:1px solid #1d3047;border-radius:16px;padding:18px;box-shadow:0 12px 30px #0005}label{display:block;font-size:12px;font-weight:700;color:#aec2da;margin:14px 0 6px}input{width:100%;border:1px solid #29415e;background:#07111f;color:#fff;border-radius:10px;padding:13px;font-size:16px;outline:none}input:focus{border-color:#4d91e8}.fixed{background:#10233a;color:#a9c7e8}.notice{margin:14px 0;background:#10253a;border:1px solid #234869;padding:11px;border-radius:10px;color:#b9d5ef;font-size:12px}.btn{width:100%;border:0;border-radius:11px;padding:14px;font-size:15px;font-weight:800;margin-top:18px;background:#2f7de1;color:white}.btn2{background:#12243a;border:1px solid #29415e;margin-top:10px}.status{font-size:12px;color:#7f9bb9;margin-top:16px;text-align:center}.badge{display:inline-block;background:#12345b;color:#9dccff;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:800}</style></head>
<body><main class="wrap"><div class="brand">ESPOSENDE</div><div class="title">Ajuste Expresso de Estoque</div><div class="sub">Inclusão de estoque para venda imediata</div>
<div class="card"><span class="badge">SOMENTE INCLUSÃO</span><div class="notice">Este canal não permite retirada de estoque. Todo ajuste deverá ser comprovado por uma venda.</div>
<label>Loja</label><input id="loja" inputmode="numeric" placeholder="Ex.: 50">
<label>Solicitante</label><input id="solicitante" placeholder="Nome de quem está solicitando">
<label>Código do produto</label><input id="codigo" inputmode="numeric" placeholder="Digite ou leia o código">
<label>Quantidade a incluir</label><input id="qtd" type="number" min="1" step="1" value="1">
<button class="btn" onclick="solicitar()">Solicitar inclusão</button>
<button class="btn btn2" onclick="foto()">Comprovar venda / fotografar ticket</button>
<input id="ticket" type="file" accept="image/*" capture="environment" hidden>
<div id="status" class="status">Integração com Seta/Links: aguardando conexão.</div></div></main>
<script>
function solicitar(){const l=loja.value.trim(),s=solicitante.value.trim(),c=codigo.value.trim(),q=Number(qtd.value);if(!l||!s||!c||!Number.isInteger(q)||q<1){status.textContent='Preencha loja, solicitante, código e quantidade.';return}status.textContent='Solicitação validada. A execução automática no Seta/Links será habilitada na próxima etapa.'}
function foto(){document.getElementById('ticket').click()}
document.getElementById('ticket').addEventListener('change',e=>{if(e.target.files.length)status.textContent='Comprovante selecionado. O envio à Auditoria será habilitado com a conexão ao banco.'})
</script></body></html>
