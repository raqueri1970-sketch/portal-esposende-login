<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatório · Central de Treinamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0f1e; --card:#131b30; --border:#232d4a;
    --text:#eef1f8; --muted:#93a0bf;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--text); font-family:'Nunito',system-ui,sans-serif; min-height:100vh;}
  .topbar{
    display:flex; align-items:center; gap:14px; padding:14px 28px;
    border-bottom:1px solid var(--border);
  }
  .topbar img{height:44px; width:44px; border-radius:10px; object-fit:cover; box-shadow:0 0 0 1px var(--border);}
  .topbar h1{font-size:17px; font-weight:800; margin:0;}
  .topbar p{margin:0; font-size:12px; color:var(--muted); font-weight:600;}
  .wrap{max-width:1000px; margin:0 auto; padding:24px 24px 60px;}
  .stats{display:flex; gap:14px; margin-bottom:20px; flex-wrap:wrap;}
  .stat{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 18px; min-width:140px;}
  .stat b{display:block; font-size:22px; font-weight:800;}
  .stat span{font-size:12px; color:var(--muted); font-weight:600;}
  .toolbar{display:flex; gap:10px; margin-bottom:16px;}
  .toolbar input{
    flex:1; background:var(--card); border:1px solid var(--border); border-radius:9px;
    color:var(--text); font-family:inherit; font-size:13.5px; padding:10px 14px;
  }
  .toolbar input:focus{outline:none; border-color:#38bdf8;}
  .toolbar button{
    background:var(--card); border:1px solid var(--border); color:var(--text);
    border-radius:9px; padding:10px 16px; font-family:inherit; font-size:13px; font-weight:700; cursor:pointer;
  }
  .toolbar button:hover{border-color:#38bdf8;}
  table{width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden;}
  thead th{
    text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.5px;
    color:var(--muted); padding:12px 16px; border-bottom:1px solid var(--border);
  }
  tbody td{padding:11px 16px; font-size:13.5px; border-bottom:1px solid var(--border);}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#182142;}
  .empty, .loading{padding:40px; text-align:center; color:var(--muted); font-size:13.5px;}
</style>
</head>
<body>

<div class="topbar">
  <img id="brand-logo" alt="Esposende">
  <div>
    <h1>Quem assistiu</h1>
    <p>Central de Treinamento · Esposende Calçados</p>
  </div>
</div>

<div class="wrap">
  <div class="stats" id="stats"></div>
  <div class="toolbar">
    <input id="search" type="text" placeholder="Buscar por loja, nome ou módulo...">
    <button id="refresh">Atualizar</button>
  </div>
  <div id="tableWrap"><div class="loading">Carregando…</div></div>
</div>

const SUPA_URL = 'https://rdztzurfesnobfkazgpm.supabase.co';
const SUPA_KEY = 'sb_publishable_4LHSO4TrP7F4m4tpJyH44g_BGmfC92h';

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function fmtData(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
}

let ROWS = [];

async function carregar(){
  document.getElementById('tableWrap').innerHTML = '<div class="loading">Carregando…</div>';
  try{
    const res = await fetch(`${SUPA_URL}/rest/v1/curso_visualizacoes?select=*&order=criado_em.desc&limit=1000`, {
      headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY }
    });
    ROWS = await res.json();
    renderStats();
    renderTable(ROWS);
  }catch(e){
    document.getElementById('tableWrap').innerHTML = '<div class="empty">Erro ao carregar os dados.</div>';
  }
}

function renderStats(){
  const lojas = new Set(ROWS.map(r=>r.loja));
  const pessoas = new Set(ROWS.map(r=>r.loja+'|'+r.nome));
  document.getElementById('stats').innerHTML = `
    <div class="stat"><b>${ROWS.length}</b><span>Visualizações</span></div>
    <div class="stat"><b>${lojas.size}</b><span>Lojas</span></div>
    <div class="stat"><b>${pessoas.size}</b><span>Pessoas</span></div>
  `;
}

function renderTable(rows){
  if(!rows.length){
    document.getElementById('tableWrap').innerHTML = '<div class="empty">Nenhuma visualização registrada ainda.</div>';
    return;
  }
  const linhas = rows.map(r=>`
    <tr>
      <td>${fmtData(r.criado_em)}</td>
      <td>${escapeHtml(r.loja)}</td>
      <td>${escapeHtml(r.nome)}</td>
      <td>${escapeHtml(r.modulo_nome)}</td>
    </tr>`).join('');
  document.getElementById('tableWrap').innerHTML = `
    <table>
      <thead><tr><th>Data/Hora</th><th>Loja</th><th>Nome</th><th>Módulo</th></tr></thead>
      <tbody>${linhas}</tbody>
    </table>`;
}

document.getElementById('search').addEventListener('input', (e)=>{
  const q = e.target.value.trim().toLowerCase();
  if(!q){ renderTable(ROWS); return; }
  renderTable(ROWS.filter(r =>
    (r.loja||'').toLowerCase().includes(q) ||
    (r.nome||'').toLowerCase().includes(q) ||
    (r.modulo_nome||'').toLowerCase().includes(q)
  ));
});
document.getElementById('refresh').addEventListener('click', carregar);

carregar();
</script>
