<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central de Treinamento — Esposende</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0f1e;
    --bg2:#0d1428;
    --card:#131b30;
    --card-hover:#182142;
    --border:#232d4a;
    --text:#eef1f8;
    --muted:#93a0bf;
    --muted2:#6b7897;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Nunito',system-ui,sans-serif;
    min-height:100vh;
  }
  .topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:14px;
    padding:14px 28px;
    background:linear-gradient(180deg,#0a0f1ecc,#0a0f1ee6 70%,transparent);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border);
  }
  .topbar img{height:38px; width:38px; border-radius:8px; object-fit:cover; flex-shrink:0;}
  .topbar h1{font-size:18px; font-weight:800; margin:0; letter-spacing:.2px;}
  .topbar p{margin:0; font-size:12.5px; color:var(--muted); font-weight:600;}

  .wrap{max-width:1240px; margin:0 auto; padding:28px 28px 60px;}
  .intro{margin-bottom:26px;}
  .intro h2{font-size:22px; font-weight:800; margin:0 0 6px;}
  .intro p{font-size:14px; color:var(--muted); margin:0; max-width:640px; line-height:1.5;}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:22px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
    cursor:pointer;
    transition:transform .18s ease, border-color .18s ease, background .18s ease;
  }
  .card:hover{
    transform:translateY(-3px);
    border-color:var(--accent);
    background:var(--card-hover);
  }
  .cover-wrap{position:relative; aspect-ratio:16/9; overflow:hidden; background:#060a16;}
  .cover-wrap svg{display:block; width:100%; height:100%;}
  .play-badge{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    opacity:0; transition:opacity .18s ease;
    background:rgba(6,10,22,.35);
  }
  .card:hover .play-badge{opacity:1;}
  .play-badge .circle{
    width:56px; height:56px; border-radius:50%;
    background:rgba(255,255,255,.14);
    border:1.5px solid rgba(255,255,255,.6);
    display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(2px);
  }
  .play-badge svg{width:22px; height:22px; margin-left:3px;}

  .duration-pill{
    position:absolute; right:8px; bottom:8px;
    background:rgba(0,0,0,.72);
    color:#fff; font-size:11.5px; font-weight:700;
    padding:2px 7px; border-radius:5px;
    letter-spacing:.3px;
  }

  .info{padding:14px 16px 16px;}
  .info .modulo-tag{font-size:11px; font-weight:800; letter-spacing:.8px; text-transform:uppercase; margin:0 0 4px;}
  .info h3{font-size:16px; font-weight:800; margin:0 0 4px; line-height:1.25;}
  .info p{font-size:12.5px; color:var(--muted); margin:0; line-height:1.4;}

  /* Player overlay */
  .overlay{
    position:fixed; inset:0; background:#03060eee;
    display:none; align-items:center; justify-content:center;
    z-index:100; padding:24px;
  }
  .overlay.open{display:flex;}
  .player-box{
    width:100%; max-width:1000px;
    background:#0a0f1e; border:1px solid var(--border); border-radius:14px;
    overflow:hidden;
  }
  .player-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; border-bottom:1px solid var(--border);
  }
  .player-head .left{display:flex; align-items:center; gap:10px;}
  .player-head .dot{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
  .player-head h4{margin:0; font-size:15px; font-weight:800;}
  .player-head span{font-size:12px; color:var(--muted); font-weight:600;}
  .close-btn{
    background:none; border:none; color:var(--muted); cursor:pointer;
    width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center;
  }
  .close-btn:hover{background:var(--card-hover); color:var(--text);}
  video{width:100%; display:block; background:#000; max-height:70vh;}
  .player-status{
    padding:60px 20px; text-align:center; color:var(--muted); font-size:13.5px; font-weight:600;
  }
  .spinner{
    width:26px; height:26px; border-radius:50%;
    border:3px solid var(--border); border-top-color:#38bdf8;
    animation:spin .8s linear infinite; margin:0 auto 12px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  @media (max-width:520px){
    .wrap{padding:20px 16px 48px;}
    .topbar{padding:12px 16px;}
    .grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="topbar">
  <img id="brand-logo" alt="Esposende">
  <div>
    <h1>Central de Treinamento</h1>
    <p>Esposende Calçados · Processos operacionais</p>
  </div>
</div>

<div class="wrap">
  <div class="intro">
    <h2>Módulos de processo</h2>
    <p>Clique em um módulo para assistir o vídeo do processo. Assista na ordem sugerida se estiver começando agora.</p>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div class="overlay" id="overlay">
  <div class="player-box">
    <div class="player-head">
      <div class="left">
        <span class="dot" id="playerDot"></span>
        <div>
          <h4 id="playerTitle">—</h4>
          <span id="playerSub">—</span>
        </div>
      </div>
      <button class="close-btn" id="closeBtn" aria-label="Fechar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="playerBody">
      <div class="player-status"><div class="spinner"></div>Carregando vídeo…</div>
    </div>
  </div>
</div>

    <rect x="16" y="16" width="38" height="38" rx="9" fill="#0a1230"/>
    <image href="data:image/jpeg;base64,${LOGO_B64}" x="16" y="16" width="38" height="38" preserveAspectRatio="xMidYMid slice" clip-path="url(#logoclip-${c.id})"/>
    <rect x="16" y="16" width="38" height="38" rx="9" fill="none" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="384" y="39" fill="${c.accent}" font-family="Nunito,sans-serif" font-size="12" font-weight="800" letter-spacing="2" text-anchor="end">PROCESSO 0${c.ordem}</text>
    <rect x="158" y="76" width="84" height="84" rx="20" fill="${c.accent}" fill-opacity="0.16"/>
    <rect x="158" y="76" width="84" height="84" rx="20" fill="none" stroke="${c.accent}" stroke-opacity="0.5"/>
    <g transform="translate(178,96)" stroke="${c.accent}" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      ${iconPath}
    </g>
  </svg>`;
}

const grid = document.getElementById('grid');
CURSOS.forEach(c=>{
  const card = document.createElement('div');
  card.className = 'card';
  card.style.setProperty('--accent', c.accent);
  card.innerHTML = `
    <div class="cover-wrap">
      ${coverSVG(c)}
      <div class="duration-pill">${c.duracao}</div>
      <div class="play-badge"><div class="circle">
        <svg viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
      </div></div>
    </div>
    <div class="info">
      <p class="modulo-tag" style="color:${c.accent}">Módulo ${c.ordem}</p>
      <h3>${c.nome}</h3>
      <p>${c.desc}</p>
    </div>`;
  card.addEventListener('click', ()=>openPlayer(c));
  grid.appendChild(card);
});

// -------- player --------
const VIDEOS_BASE = 'https://rdztzurfesnobfkazgpm.supabase.co/storage/v1/object/public/curso-videos/';

const overlay = document.getElementById('overlay');
const playerBody = document.getElementById('playerBody');
const playerTitle = document.getElementById('playerTitle');
const playerSub = document.getElementById('playerSub');
const playerDot = document.getElementById('playerDot');

function openPlayer(c){
  overlay.classList.add('open');
  playerTitle.textContent = c.nome;
  playerSub.textContent = `Módulo ${c.ordem} · ${c.duracao}`;
  playerDot.style.background = c.accent;
  const posterUri = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(coverSVG(c))));
  playerBody.innerHTML = `<video controls preload="metadata" poster="${posterUri}" src="${VIDEOS_BASE}${c.path}"></video>`;
  playerBody.querySelector('video').play().catch(()=>{});
}

function closePlayer(){
  overlay.classList.remove('open');
  playerBody.innerHTML = '';
}
document.getElementById('closeBtn').addEventListener('click', closePlayer);
overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closePlayer(); });
document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closePlayer(); });
</script>
</body>
</html>
